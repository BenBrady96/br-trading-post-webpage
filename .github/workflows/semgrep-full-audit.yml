name: Full Codebase Semgrep Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  semgrep-full-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Full Semgrep Scan
        run: >-
          semgrep scan --config="p/default"
          --exclude-rule html.security.audit.missing-integrity.missing-integrity
          --exclude-rule javascript.express.security.audit.xss.mustache.explicit-unescape.template-explicit-unescape
          --error
