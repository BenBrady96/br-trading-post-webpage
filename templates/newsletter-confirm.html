<div class="wrap page-head">
{{{crumbs}}}
  <h1 class="page-title">Confirm your sign-up</h1>
  <p class="page-lead">One more step and you’ll be the first to hear about our special promotions and offers.</p>
</div>

<div class="wrap">
  <section class="panel panel--wide token-action" data-token-action="confirm" aria-labelledby="confirm-title">
    <svg class="panel__icon" aria-hidden="true"><use href="#i-bell"/></svg>
    <h2 class="panel__title" id="confirm-title">Is this you?</h2>
    <p data-intro>Press the button to confirm you’d like our emails.</p>
    <button class="btn btn--primary btn--lg" type="button" data-go><svg aria-hidden="true"><use href="#i-check"/></svg>Confirm my sign-up</button>
    <p class="signup__status" role="status" data-status></p>
    <p data-when="ok" hidden><a class="btn btn--outline" href="shop/">See what’s in stock<svg aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
    <p data-when="retry" hidden><a class="btn btn--outline" href="newsletter/">Sign up again<svg aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
    <noscript><p>Turn on JavaScript to confirm, or email us at <a href="mailto:{{email}}">{{email}}</a>.</p></noscript>
  </section>
</div>
