<form class="signup" data-newsletter data-sitekey="{{sitekey}}" novalidate>
  <label class="signup__label" for="{{id}}-email">Email address</label>
  <div class="signup__controls">
    <div class="signup__box">
      <svg class="signup__icon" aria-hidden="true"><use href="#i-mail"/></svg>
      <input class="signup__input" id="{{id}}-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" maxlength="254" required placeholder="name@example.com" aria-describedby="{{id}}-note">
    </div>
    <button class="btn btn--primary signup__submit" type="submit">Sign up<svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
  </div>
  <div hidden>
    <label for="{{id}}-website">Leave this empty</label>
    <input id="{{id}}-website" name="website" type="text" tabindex="-1" autocomplete="off">
  </div>
  <div class="signup__check" data-turnstile></div>
  <p class="signup__status" role="status" data-status></p>
  <p class="signup__note" id="{{id}}-note">No spam, and you can unsubscribe at any time. <a href="privacy/#newsletter">How we use your email</a>.</p>
  <noscript><p class="signup__note">Turn on JavaScript to sign up, or email us at <a href="mailto:{{email}}">{{email}}</a>.</p></noscript>
</form>
