<div class="wrap page-head">
{{{crumbs}}}
  <h1 class="page-title">Promotions</h1>
  <p class="page-lead">Offers, giveaways and events from BR Trading Post. Each one ends at the time shown, so don’t miss out.</p>
</div>

<div class="wrap page-body">
  <div class="results">
    <span class="section__status" data-live-status></span>
  </div>
  <div class="promo-list" data-promo-list>
{{{promotions}}}
  </div>
  <div class="empty" data-promo-empty{{{emptyHidden}}}>
    <svg class="empty__icon" aria-hidden="true"><use href="#i-tag"/></svg>
    <h2 class="empty__title">No promotions running right now</h2>
    <p>Follow us to hear about the next one first.</p>
{{{follow}}}
  </div>
</div>
